blueprint:
  name: "TV LG: bật TV / thoát app là về Màn hình chính"
  description: >-
    Đưa **Màn hình chính** (`com.viet.home`, màn chọn app kiểu Android TV / Apple TV) lên trong hai trường hợp:


    1. **TV vừa bật** (từ tắt sang bật): đợi vài giây cho TV khởi động xong rồi mở.

    2. **Thoát một app** trong danh sách «App quản lý» (YouTube, Live Cam…): khi TV rơi về nguồn nền (HDMI / truyền hình) thì mở lại Màn hình chính, trễ ~2 giây.
    Chuyển thẳng từ app này sang app khác, hoặc bấm nút **Input** để đổi nguồn thì KHÔNG bị chen vào.


    **Nút Home trên remote KHÔNG thay được** (đã đo trên 49UH617T webOS 3): thanh chọn app của LG là lớp phủ đè lên app đang chạy, `app_id` không đổi nên Home Assistant không biết bạn vừa bấm Home. Muốn vào Màn hình chính từ thanh đó, chọn thẻ «Màn hình chính» (nằm đầu hàng).


    **Cần:** TV đã thêm vào HA bằng tích hợp **LG webOS TV** (thực thể có thuộc tính `app_id`); app `com.viet.home` đã cài (Developer Mode). TV tắt hẳn rồi rút điện thì HA chỉ thấy `unavailable` → `on`; blueprint tính cả trường hợp này. Chưa cài app thì lệnh mở thất bại và không có gì xảy ra.
  domain: automation
  author: TriTue2011
  homeassistant:
    min_version: 2024.11.0
  input:
    tv:
      name: TV LG
      selector:
        entity:
          integration: webostv
          domain: media_player
    app_id:
      name: ID app Màn hình chính
      default: com.viet.home
      selector:
        text: {}
    cho_giay:
      name: Đợi bao nhiêu giây sau khi TV bật
      description: "TV vừa bật còn đang nạp nguồn cuối. Mở app quá sớm thì bị LG Home đè lại. Mặc định 12 giây."
      default: 12
      selector:
        number: {min: 3, max: 60, mode: box, unit_of_measurement: s}
    khi_bat_tv:
      name: ① Mở khi TV vừa bật
      default: true
      selector:
        boolean: {}
    khi_thoat_app:
      name: ② Mở khi thoát một app
      default: true
      selector:
        boolean: {}
    apps_quan_ly:
      name: App quản lý (thoát khỏi các app này thì về Màn hình chính)
      description: "ID app. Không thêm `com.viet.home` (thoát Màn hình chính là để xem nguồn đang chạy)."
      default:
        - youtube.leanback.v4
        - com.ssiptv.app
        - com.viet.livecam
        - com.webos.app.browser
        - com.webos.app.photovideo
        - com.webos.app.music
        - com.webos.app.discovery
        - com.webos.app.miracast
        - com.webos.app.tvuserguide
      selector:
        text: {multiple: true}
    nguon_nen:
      name: ID các nguồn nền (nơi TV rơi về sau khi thoát app)
      default:
        - com.webos.app.hdmi1
        - com.webos.app.hdmi2
        - com.webos.app.hdmi3
        - com.webos.app.externalinput.av1
        - com.webos.app.livetv
      selector:
        text: {multiple: true}
mode: parallel
max: 5
max_exceeded: silent
variables:
  tv_id: !input tv
  khi_bat: !input khi_bat_tv
  khi_thoat: !input khi_thoat_app
  nen: !input nguon_nen
triggers:
  - trigger: state
    id: bat
    entity_id: !input tv
    from: ["off", "unavailable"]
    to: "on"
  - trigger: state
    id: thoat
    entity_id: !input tv
    attribute: app_id
    from: !input apps_quan_ly
actions:
  # Moi nhanh tu quyet dinh co mo hay khong bang if/then (condition dat trong nhanh choose KHONG dung ca automation trong HA)
  - choose:
      - conditions: "{{ trigger.id == 'bat' and khi_bat }}"
        sequence:
          - delay:
              seconds: !input cho_giay
          - if:
              - condition: template
                value_template: "{{ is_state(tv_id, 'on') }}"
            then:
              - action: webostv.command
                data:
                  entity_id: !input tv
                  command: com.webos.applicationManager/launch
                  payload:
                    id: !input app_id
      - conditions: "{{ trigger.id == 'thoat' and khi_thoat }}"
        sequence:
          - delay: {seconds: 2}
          # chi khi TV da roi ve nguon nen (hoac trong); dang o app khac, Input hay chinh Man hinh chinh thi thoi
          - if:
              - condition: template
                value_template: >-
                  {% set a = state_attr(tv_id, 'app_id') or '' %}
                  {{ is_state(tv_id, 'on') and (a == '' or a in nen) }}
            then:
              - action: webostv.command
                data:
                  entity_id: !input tv
                  command: com.webos.applicationManager/launch
                  payload:
                    id: !input app_id
