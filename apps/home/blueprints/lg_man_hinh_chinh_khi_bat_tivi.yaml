blueprint:
  name: "TV LG: bật TV / thoát app là về Màn hình chính"
  description: >-
    Đưa **Màn hình chính** (`com.viet.home`, màn chọn app kiểu Android TV / Apple TV) lên trong ba trường hợp:


    1. **TV vừa bật** (từ tắt sang bật): đợi vài giây cho TV khởi động xong rồi mở.

    2. **Thoát một app** trong danh sách «App quản lý» (YouTube, Live Cam…): khi TV rơi về nguồn nền (HDMI / truyền hình / màn Home của LG) thì mở lại Màn hình chính.
    Chuyển thẳng từ app này sang app khác, hoặc bấm nút **Input** để đổi nguồn thì KHÔNG bị chen vào.

    3. *(tuỳ chọn, mặc định tắt)* Bấm **nút Home** trên remote: màn Home của LG vừa hiện thì thay bằng Màn hình chính.


    **Giới hạn thật:** TV webOS 3 không cho app thường thay màn Home của LG hay bắt phím Back trong app khác (cần root), nên đây là cách duy nhất: Home Assistant thấy app đổi và mở Màn hình chính đè lên, nên có độ trễ ~2 giây. Bấm **Back** trong Màn hình chính để thoát ra nguồn đang xem.
    Chưa kiểm: màn Home của LG báo `app_id` nào (đặt ở mục «ID app Home của LG»); mở Cài đặt của LG từ Màn hình chính chưa xác nhận được — vì vậy tuỳ chọn 3 mặc định tắt (nút ⚙ trên remote vẫn vào được Cài đặt).


    **Cần:** TV đã thêm vào HA bằng tích hợp **LG webOS TV** (thực thể có thuộc tính `app_id`); app `com.viet.home` đã cài (Developer Mode). TV tắt hẳn rồi rút điện thì HA chỉ thấy `unavailable` → `on`; blueprint tính cả trường hợp này.
  domain: automation
  author: TriTue2011
  homeassistant:
    min_version: 2024.11.0
  input:
    tv:
      name: TV LG
      selector:
        entity:
          integration: webostv
          domain: media_player
    app_id:
      name: ID app Màn hình chính
      default: com.viet.home
      selector:
        text: {}
    cho_giay:
      name: Đợi bao nhiêu giây sau khi TV bật
      description: "TV vừa bật còn đang nạp nguồn cuối. Mở app quá sớm thì bị LG Home đè lại. Mặc định 12 giây."
      default: 12
      selector:
        number: {min: 3, max: 60, mode: box, unit_of_measurement: s}
    khi_bat_tv:
      name: ① Mở khi TV vừa bật
      default: true
      selector:
        boolean: {}
    khi_thoat_app:
      name: ② Mở khi thoát một app
      default: true
      selector:
        boolean: {}
    apps_quan_ly:
      name: App quản lý (thoát khỏi các app này thì về Màn hình chính)
      description: "ID app. Không thêm `com.viet.home` (thoát Màn hình chính là để xem nguồn đang chạy)."
      default:
        - youtube.leanback.v4
        - com.ssiptv.app
        - com.viet.livecam
        - com.webos.app.browser
        - com.webos.app.photovideo
        - com.webos.app.music
        - com.webos.app.discovery
        - com.webos.app.miracast
        - com.webos.app.tvuserguide
      selector:
        text: {multiple: true}
    nguon_nen:
      name: ID các nguồn nền (nơi TV rơi về sau khi thoát app)
      default:
        - com.webos.app.hdmi1
        - com.webos.app.hdmi2
        - com.webos.app.hdmi3
        - com.webos.app.externalinput.av1
        - com.webos.app.livetv
      selector:
        text: {multiple: true}
    thay_nut_home:
      name: ③ Thay nút Home của LG bằng Màn hình chính
      description: "Mặc định TẮT. Bật thì bấm Home trên remote sẽ mở Màn hình chính thay vì Home của LG."
      default: false
      selector:
        boolean: {}
    app_home_lg:
      name: ID app Home của LG
      default: com.webos.app.home
      selector:
        text: {}
# song song: thoat app thang sang Home cua LG ban CA HAI kich hoat (thoat + home_lg); che do restart se de kich hoat sau giet luot dung
mode: parallel
max: 5
max_exceeded: silent
variables:
  tv_id: !input tv
  khi_bat: !input khi_bat_tv
  khi_thoat: !input khi_thoat_app
  thay_home: !input thay_nut_home
  nen: !input nguon_nen
  home_lg: !input app_home_lg
triggers:
  - trigger: state
    id: bat
    entity_id: !input tv
    from: ["off", "unavailable"]
    to: "on"
  - trigger: state
    id: thoat
    entity_id: !input tv
    attribute: app_id
    from: !input apps_quan_ly
  - trigger: state
    id: home_lg
    entity_id: !input tv
    attribute: app_id
    to: !input app_home_lg
actions:
  # Moi nhanh tu quyet dinh co mo hay khong bang if/then (condition dat trong nhanh choose KHONG dung ca automation trong HA)
  - choose:
      - conditions: "{{ trigger.id == 'bat' and khi_bat }}"
        sequence:
          - delay:
              seconds: !input cho_giay
          - if:
              - condition: template
                value_template: "{{ is_state(tv_id, 'on') }}"
            then:
              - action: webostv.command
                data:
                  entity_id: !input tv
                  command: com.webos.applicationManager/launch
                  payload:
                    id: !input app_id
      - conditions: "{{ trigger.id == 'thoat' and khi_thoat }}"
        sequence:
          - delay: {seconds: 2}
          # chi khi TV da roi ve nguon nen (hoac trong / Home cua LG); dang o app khac, Input hay chinh Man hinh chinh thi thoi
          - if:
              - condition: template
                value_template: >-
                  {% set a = state_attr(tv_id, 'app_id') or '' %}
                  {{ is_state(tv_id, 'on') and (a == '' or a == home_lg or a in nen) }}
            then:
              - action: webostv.command
                data:
                  entity_id: !input tv
                  command: com.webos.applicationManager/launch
                  payload:
                    id: !input app_id
      - conditions: "{{ trigger.id == 'home_lg' and thay_home }}"
        sequence:
          - delay: {seconds: 1}
          - if:
              - condition: template
                value_template: "{{ is_state(tv_id, 'on') and (state_attr(tv_id, 'app_id') or '') == home_lg }}"
            then:
              - action: webostv.command
                data:
                  entity_id: !input tv
                  command: com.webos.applicationManager/launch
                  payload:
                    id: !input app_id
